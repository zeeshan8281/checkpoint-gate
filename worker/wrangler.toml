name = "checkpoint-gate"
main = "src/index.js"
compatibility_date = "2025-11-01"

[assets]
directory = "../web"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "CAMPAIGNS"
class_name = "Campaign"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Campaign"]

[[r2_buckets]]
binding = "EVIDENCE"
bucket_name = "checkpoint-gate-evidence"

[vars]
LEASE_SECONDS = "600"
